# Sobald der Laptop eine neue oder ergänzte Ausgabe hochlädt (docs/latest.json ändert sich),
# legt der GitHub-Bot ein Issue mit Link an. Weil der Bot (nicht du) der Autor
# ist und dich erwähnt, schickt GitHub dir eine Benachrichtigungs-Mail.
name: notify
on:
  push:
    branches: [main]
    paths: [docs/latest.json]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Issue mit Link anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          d = json.load(open("docs/latest.json"))
          def lines(sec):
              mark = {3: "🔴", 2: "🟠", 1: "⚪"}
              return "\n".join(f"- {mark.get(t['importance'], '⚪')} **{t['title']}** — {t['what']}" for t in sec["top"])
          news = d.get("news") or {"count": 0, "headline": "", "top": []}
          body = f"""## [➜ Dashboard vom {d['date']} öffnen]({d['url']})

          ### News des Tages ({news['count']})
          {news['headline']}

          {lines(news)}

          ### Gezielt beobachtet
          **GitHub ({d['github']['count']} Repos):** {d['github']['headline']}

          {lines(d['github'])}

          **Reddit ({d['reddit']['count']} Beiträge):** {d['reddit']['headline']}

          {lines(d['reddit'])}

          [Archiv aller Ausgaben]({d['archive_url']}) · @{d['notify']}
          """
          body = "\n".join(l.strip() if l.startswith("          ") else l for l in body.splitlines())
          title = f"KI-Radar {d['date']}: {news['count']} News, {d['github']['count']} Repos, {d['reddit']['count']} Reddit-Beiträge"
          subprocess.run(["gh", "label", "create", "ausgabe", "--color", "3b5bdb", "-R", os.environ["REPO"]], check=False)
          old = subprocess.run(["gh", "issue", "list", "-R", os.environ["REPO"], "--label", "ausgabe",
                                "--state", "open", "--json", "number", "-q", ".[].number"],
                               capture_output=True, text=True, check=True).stdout.split()
          for n in old:
              subprocess.run(["gh", "issue", "close", n, "-R", os.environ["REPO"]], check=True)
          subprocess.run(["gh", "issue", "create", "-R", os.environ["REPO"], "--title", title,
                          "--body", body, "--label", "ausgabe"], check=True)
          EOF
